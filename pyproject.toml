[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-corpus"
version = "0.1.0"
description = "Corpus foundation for an Indian Commercial Court legal RAG system"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "pypdf>=5.0,<7.0",
    "qdrant-client>=1.14,<1.16",
    "sentence-transformers>=3.0,<6.0",
    "SQLAlchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["legal_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
